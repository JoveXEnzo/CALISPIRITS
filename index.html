<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CarPoolX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
}

.section {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.section img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  text-align: center;
  background: rgba(0,0,0,0.45);
  padding: 30px 40px;
  border-radius: 14px;
}

.logo {
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 2px;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 26px;
  background: #00e0ff;
  color: black;
  font-weight: bold;
  border-radius: 8px;
  text-decoration: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  height: 100vh;
}

.grid img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="section">
  <img src="https://images.unsplash.com/photo-1519003722824-194d4455a60c" />
  <div class="overlay">
    <div class="logo">CarPoolX</div>
    <div>Ride Smarter. Ride Together.</div>
    <a href="#" class="btn">Get the App</a>
  </div>
</section>

<!-- FEATURE IMAGE STRIP -->
<section class="grid">
  <img src="https://images.unsplash.com/photo-1493238792000-8113da705763">
  <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">
  <img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d">
</section>

<!-- APP MOCKUP SECTION -->
<section class="section">
  <img src="https://images.unsplash.com/photo-1556740738-b6a63e27c4df">
  <div class="overlay">
    <div>AI Ride Matching</div>
    <div>Split Costs • Faster Routes • More Seats</div>
  </div>
</section>

<!-- COMMUNITY / CARPOOL VISUAL -->
<section class="section">
  <img src="https://images.unsplash.com/photo-1520975922284-9e0ce82759c9">
  <div class="overlay">
    <div>Share the Ride</div>
    <div>Save Money & Reduce Traffic</div>
  </div>
</section>

<!-- FINAL CTA -->
<section class="section">
  <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a">
  <div class="overlay">
    <div class="logo">Join CarPoolX</div>
    <a href="#" class="btn">Sign Up Now</a>
  </div>
</section>

</body>
</html>
