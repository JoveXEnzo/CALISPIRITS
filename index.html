<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cali Spirits — Cinematic Lab Vodka</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#05070a;
  color:white;
  overflow-x:hidden;
}

/* ---------- SCROLL PROGRESS BAR ---------- */

#progress{
  position:fixed;
  top:0;
  left:0;
  height:4px;
  width:0%;
  background:linear-gradient(90deg,#ff2d2d,#ff8a00);
  z-index:9999;
}

/* ---------- HERO CINEMATIC ---------- */

.hero{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  padding:120px 80px;
  background:
    radial-gradient(circle at 20% 20%, #1b1f2a, #05070a 60%);
}

.hero h1{
  font-size:72px;
  line-height:1.02;
  text-shadow:0 0 30px rgba(255,0,0,.25);
}

.glow-btn{
  background:linear-gradient(45deg,#ff2d2d,#ff7b00);
  border:none;
  padding:18px 30px;
  font-weight:900;
  border-radius:14px;
  color:white;
  cursor:pointer;
  box-shadow:
    0 0 0 rgba(255,60,60,0),
    0 0 40px rgba(255,60,60,.6);
  transition:.3s;
}

.glow-btn:hover{
  box-shadow:
    0 0 30px rgba(255,60,60,.9),
    0 0 80px rgba(255,60,60,.6);
  transform:translateY(-3px);
}

/* ---------- PARALLAX LAYERS ---------- */

.layer{
  position:fixed;
  width:140%;
  height:140%;
  pointer-events:none;
  opacity:.08;
  background:
   repeating-linear-gradient(
     90deg,
     #ffffff22,
     #ffffff22 1px,
     transparent 1px,
     transparent 40px
   );
}

/* ---------- GLASS PANELS ---------- */

.glass{
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(18px);
  border-radius:24px;
  padding:50px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 40px 120px rgba(0,0,0,.8);
}

/* ---------- GIF WALL ---------- */

.gif-wall{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.gif-wall img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:18px;
  filter:contrast(1.1) saturate(1.1);
  transition:.4s;
}

.gif-wall img:hover{
  transform:scale(1.05);
  box-shadow:0 30px 80px rgba(0,0,0,.9);
}

/* ---------- COUNTERS ---------- */

.counter{
  font-size:54px;
  font-weight:900;
  color:#ff5a2a;
}

/* ---------- RETAIL STRIP ---------- */

.retail{
  display:flex;
  gap:30px;
  overflow-x:auto;
}

.retail div{
  min-width:260px;
  padding:40px;
  border-radius:18px;
  background:linear-gradient(#111,#0a0a0a);
  box-shadow:0 20px 60px rgba(0,0,0,.9);
  font-weight:900;
}

/* ---------- REVEAL ---------- */

.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:.9s;
}

.reveal.show{
  opacity:1;
  transform:none;
}

.section{
  padding:140px 80px;
}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .gif-wall{grid-template-columns:1fr}
}

</style>
</head>

<body>

<div id="progress"></div>
<div class="layer" id="grid"></div>

<!-- HERO -->

<section class="hero">

<div class="reveal">
<h1>Distilled With<br>Scientific Precision</h1>
<p>Advanced vodka refinement architecture</p>
<button class="glow-btn" onclick="go('process')">
ENTER THE PROCESS
</button>
</div>

<img id="heroImg" src="assets/hero.png" style="width:520px">

</section>

<!-- PROCESS GIF WALL -->

<section id="process" class="section reveal">

<div class="glass">
<h2>Live Distillation Systems</h2>

<div class="gif-wall">
<img src="https://media.giphy.com/media/3o6Zt481isNVuQI1l6/giphy.gif">
<img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
<img src="https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif">
</div>

</div>

</section>

<!-- METRICS -->

<section class="section reveal">

<div class="glass">
<h2>Refinement Metrics</h2>
<div class="counter" data-n="7">0</div>
<p>Stage Purification Model</p>
</div>

</section>

<!-- RETAIL DEMO -->

<section class="section reveal">

<h2>Retail Distribution Capability (Demo)</h2>

<div class="retail">
<div>Walmart</div>
<div>Target</div>
<div>Albertsons</div>
<div>Vons</div>
<div>Ralphs</div>
</div>

</section>

<!-- HOTLINE -->

<section class="section reveal">

<div class="glass">
<h2>Wholesale Distribution Hotline</h2>
<h1>1-800-CALI-LAB</h1>
<button class="glow-btn">Distributor Access</button>
</div>

</section>

<script>

/* scroll progress */

window.onscroll=()=>{
  let h=document.documentElement;
  let sc=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
  progress.style.width=sc+"%";
};

/* reveal */

const io=new IntersectionObserver(es=>{
 es.forEach(e=>{
  if(e.isIntersecting)e.target.classList.add("show");
 });
});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

/* parallax grid */

document.addEventListener("mousemove",e=>{
 grid.style.transform=
  `translate(${e.clientX/50}px,${e.clientY/50}px)`;
});

/* scroll jump */

function go(id){
 document.getElementById(id)
   .scrollIntoView({behavior:"smooth"});
}

/* counter */

document.querySelectorAll(".counter").forEach(c=>{
 let n=+c.dataset.n;
 let i=setInterval(()=>{
  c.innerText++;
  if(c.innerText>=n)clearInterval(i);
 },120);
});

</script>

</body>
</html>
